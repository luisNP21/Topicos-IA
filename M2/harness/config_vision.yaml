proyecto:
  nombre: "M4 -- Evaluacion con componente visual (imagen -> OCR/VLM -> NER)"
  seed_global: 42

rutas:
  # Mismo gold que M2/run_inference/config_vision.yaml (eval_set_path): los 15
  # casos de M3 con sus 57 entidades. Relativo a PROJECT_ROOT; en Colab los
  # notebooks de M4/ejecucion/harness/ lo copian a Drive y sobrescriben la ruta.
  gold_set: "M4/eval_set/eval_set_casos.jsonl"
  # Outputs separados del baseline de texto para no pisar scorecard_m2.*
  outputs_dir: "M2/outputs_vision"
  # Apunta al config de run_inference con fuente.tipo=vision. De aquí el harness
  # deriva la ruta del cache de predicciones (output_path) y su sidecar de
  # metadatos de visión (<output>.vision_meta.json).
  inference_config: "../run_inference/config_vision.yaml"

archivos_salida:
  dimension1: "resultado_dimension1.json"
  dimension1b: "resultado_dimension1b.json"
  dimension3: "resultado_dimension3.json"
  scorecard_json: "scorecard_vision.json"
  scorecard_md: "scorecard_vision.md"

modelo:
  base_checkpoint: "PlanTL-GOB-ES/roberta-base-biomedical-clinical-es"

dimension1b_similitud_semantica:
  modelo_embeddings: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  funcion_similitud: "emb"
  algoritmo_asignacion: "hungaro"
  calibracion_umbral:
    n_pares_negativos: 4000
    seed: 42

dimension3_llm_judge:
  judge_model: "qwen/qwen3.8-27b"
  judge_provider: "groq"
  judge_temperature: 0.0
  judge_max_tokens: 600
  judge_pausa_entre_llamadas: 3.0
  fallar_si_modelo_no_disponible: true
  pares_longitud_path: "length_bias_pairs.json"

scorecard:
  archivo_salida_json: "scorecard_vision.json y scorecard_vision.md"
  umbrales_debilidad:
    f1_bajo: 0.2
    f1_alto: 0.7
    score_juez_bajo: 2.5
    score_juez_alto: 3.5

audit:
  doc_id: "debe preservarse intacto en eval_set y resultados"
